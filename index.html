<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Colors - Dark theme */
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --bg-hover: #30363d;
      --bg-elevated: #1c2128;
      --border: #30363d;
      --border-subtle: #262c36;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --accent-glow: rgba(88, 166, 255, 0.15);
      --accent-subtle: rgba(88, 166, 255, 0.1);
      --success: #3fb950;
      --success-muted: rgba(63, 185, 80, 0.15);
      --warning: #d29922;
      --warning-muted: rgba(210, 153, 34, 0.15);
      --danger: #f85149;
      --danger-muted: rgba(248, 81, 73, 0.15);

      /* Spacing */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --space-xl: 20px;
      --space-2xl: 24px;

      /* Radii */
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-xl: 12px;

      /* Shadows */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
      --shadow-glow: 0 0 20px var(--accent-glow);

      /* Transitions */
      --transition-fast: 0.15s ease;
      --transition-normal: 0.2s ease;
      --transition-slow: 0.3s ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* Layout */
    .app { display: flex; flex-direction: column; min-height: 100vh; }

    .navbar {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-lg);
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .navbar-left { display: flex; gap: var(--space-sm); align-items: center; }
    .navbar-center {
      flex: 1;
      text-align: center;
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .navbar-right { display: flex; gap: var(--space-sm); align-items: center; }

    .main-content {
      flex: 1;
      display: flex;
      position: relative;
    }

    .view-container { flex: 1; padding: var(--space-lg); overflow-y: auto; }

    /* Buttons */
    .btn {
      padding: var(--space-sm) var(--space-md);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all var(--transition-fast);
    }
    .btn:hover {
      background: var(--bg-hover);
      border-color: var(--text-muted);
    }
    .btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--bg-primary), 0 0 0 4px var(--accent);
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 600;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    .btn-sm { padding: var(--space-xs) var(--space-sm); font-size: 12px; }
    .btn-icon { padding: var(--space-sm) 10px; }

    /* Week Grid */
    .week-grid {
      display: grid;
      grid-template-columns: 100px repeat(7, 1fr);
      gap: 1px;
      background: var(--border-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: var(--space-lg);
    }

    .grid-header, .grid-cell, .grid-label {
      padding: 10px var(--space-sm);
      background: var(--bg-secondary);
      text-align: center;
      transition: background var(--transition-fast);
    }

    .grid-header {
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      position: relative;
    }
    .grid-header:hover {
      background: var(--bg-tertiary);
    }
    .grid-header.selected {
      background: var(--bg-elevated);
      color: var(--text-primary);
      box-shadow: inset 0 -2px 0 var(--accent), var(--shadow-glow);
    }
    .grid-header.today {
      color: var(--accent);
    }
    .grid-header.today.selected {
      color: var(--accent);
    }
    .grid-header .header-date {
      display: block;
      font-size: 10px;
      font-weight: 400;
      margin-top: 2px;
      opacity: 0.7;
    }

    .grid-label {
      text-align: left;
      font-weight: 500;
      background: var(--bg-tertiary);
      font-size: 13px;
      color: var(--text-secondary);
    }

    .grid-cell {
      cursor: pointer;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .grid-cell:hover { background: var(--bg-hover); }
    .grid-cell.column-selected {
      background: var(--accent-subtle);
    }
    .grid-cell.column-selected:hover {
      background: rgba(88, 166, 255, 0.2);
    }

    .cell-content {
      font-size: 12px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
    }
    .cell-done {
      color: var(--success);
      background: var(--success-muted);
    }
    .cell-partial {
      color: var(--warning);
      background: var(--warning-muted);
    }
    .cell-none {
      color: var(--text-muted);
    }

    /* Day Drawer */
    .drawer {
      width: 340px;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      padding: var(--space-lg);
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform var(--transition-slow);
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
    }
    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-xl);
      padding-bottom: var(--space-md);
      border-bottom: 1px solid var(--border);
    }

    .drawer-title { font-weight: 600; font-size: 16px; }
    .drawer-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 20px;
      padding: var(--space-xs);
      border-radius: var(--radius-sm);
      transition: all var(--transition-fast);
    }
    .drawer-close:hover {
      color: var(--text-primary);
      background: var(--bg-hover);
    }

    .drawer-section { margin-bottom: var(--space-xl); }
    .drawer-section-title {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Form Controls */
    .checkbox-group { display: flex; flex-direction: column; gap: var(--space-sm); }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: var(--space-sm);
      border-radius: var(--radius-md);
      transition: background var(--transition-fast);
    }
    .checkbox-item:hover {
      background: var(--bg-hover);
    }
    .checkbox-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .checkbox-item input[type="checkbox"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .radio-group { display: flex; flex-direction: column; gap: var(--space-sm); }
    .radio-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: var(--space-sm);
      border-radius: var(--radius-md);
      transition: background var(--transition-fast);
    }
    .radio-item:hover {
      background: var(--bg-hover);
    }
    .radio-item input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Rating buttons (shared for Guitar and Work) */
    .rating-buttons {
      display: flex;
      gap: var(--space-sm);
    }
    .rating-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all var(--transition-fast);
    }
    .rating-btn:hover {
      background: var(--bg-hover);
      border-color: var(--text-muted);
    }
    .rating-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--bg-primary), 0 0 0 4px var(--accent);
    }
    .rating-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    /* Week Summary - Premium Redesign */
    .week-summary {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
    }

    .summary-header {
      display: flex;
      align-items: center;
      gap: var(--space-xl);
      margin-bottom: var(--space-xl);
      padding-bottom: var(--space-lg);
      border-bottom: 1px solid var(--border);
    }

    .donut-container {
      position: relative;
      width: 100px;
      height: 100px;
      flex-shrink: 0;
    }
    .donut-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .donut-track {
      fill: none;
      stroke: var(--bg-tertiary);
      stroke-width: 8;
    }
    .donut-progress {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset var(--transition-slow);
    }
    .donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .donut-percent {
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }
    .donut-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .summary-header-info {
      flex: 1;
    }
    .summary-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: var(--space-xs);
    }
    .summary-subtitle {
      color: var(--text-muted);
      font-size: 13px;
    }

    .summary-stats {
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
    }

    .stat-category {
      background: var(--bg-tertiary);
      border-radius: var(--radius-md);
      padding: var(--space-md);
    }

    .stat-category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-sm);
    }
    .stat-category-title {
      font-weight: 600;
      font-size: 13px;
    }
    .stat-category-pct {
      font-weight: 600;
      font-size: 13px;
    }

    .stat-progress-bar {
      height: 6px;
      background: var(--bg-hover);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: var(--space-sm);
    }
    .stat-progress-fill {
      height: 100%;
      border-radius: 3px;
      transition: width var(--transition-slow);
    }
    .stat-progress-fill.success { background: var(--success); }
    .stat-progress-fill.warning { background: var(--warning); }
    .stat-progress-fill.danger { background: var(--danger); }

    .stat-detail {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .stat-subitems {
      display: flex;
      gap: var(--space-sm);
      margin-top: var(--space-sm);
    }
    .stat-subitem {
      flex: 1;
      text-align: center;
      padding: var(--space-xs) var(--space-sm);
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
    }
    .stat-subitem-label {
      font-size: 9px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }
    .stat-subitem-value {
      font-size: 12px;
      font-weight: 600;
      margin-top: 1px;
    }

    .stat-guitar {
      display: flex;
      gap: var(--space-lg);
    }
    .stat-guitar-item {
      flex: 1;
      text-align: center;
    }
    .stat-guitar-value {
      font-size: 20px;
      font-weight: 700;
    }
    .stat-guitar-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* History View */
    .history-list { display: flex; flex-direction: column; gap: var(--space-sm); }

    .history-item {
      display: grid;
      grid-template-columns: 1fr repeat(5, 80px);
      gap: var(--space-lg);
      align-items: center;
      padding: var(--space-md) var(--space-lg);
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .history-item:hover {
      background: var(--bg-tertiary);
      border-color: var(--text-muted);
    }

    .history-date { font-weight: 500; }
    .history-stat { text-align: center; font-size: 13px; }
    .history-stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      transition: opacity var(--transition-normal);
    }
    .modal-overlay.open {
      display: flex;
      opacity: 1;
    }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: var(--space-2xl);
      max-width: 480px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(0.95);
      transition: transform var(--transition-normal);
      box-shadow: var(--shadow-lg);
    }
    .modal-overlay.open .modal {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-xl);
    }
    .modal-title { font-size: 18px; font-weight: 600; }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 24px;
      padding: var(--space-xs);
      border-radius: var(--radius-sm);
      transition: all var(--transition-fast);
    }
    .modal-close:hover {
      color: var(--text-primary);
      background: var(--bg-hover);
    }

    .form-group { margin-bottom: var(--space-lg); }
    .form-label { display: block; margin-bottom: var(--space-sm); font-size: 13px; color: var(--text-secondary); }
    .form-input {
      width: 100%;
      padding: var(--space-sm) var(--space-md);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 14px;
      transition: all var(--transition-fast);
    }
    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md); }

    .modal-footer { display: flex; justify-content: flex-end; gap: var(--space-sm); margin-top: var(--space-xl); }

    /* Overall View */
    .overall-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--space-lg);
    }

    .overall-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
    }

    .overall-card-title {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: var(--space-md);
      font-weight: 600;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: var(--space-lg);
      font-size: 13px;
    }
    .toggle-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    /* View headers */
    .view-header {
      margin-bottom: var(--space-xl);
    }
    .view-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: var(--space-xs);
    }
    .view-subtitle {
      color: var(--text-secondary);
      font-size: 13px;
    }

    /* Data actions */
    .data-actions {
      display: flex;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-lg);
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
    }

    /* Overall percent (reused in cards) */
    .overall-percent {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: var(--space-lg);
    }
    .overall-percent.success { color: var(--success); }
    .overall-percent.warning { color: var(--warning); }
    .overall-percent.danger { color: var(--danger); }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: var(--space-xs) 0;
      font-size: 13px;
    }
    .summary-label { color: var(--text-secondary); }
    .summary-value { font-weight: 500; }
    .summary-value.success { color: var(--success); }
    .summary-value.warning { color: var(--warning); }
    .summary-value.danger { color: var(--danger); }

    /* Responsive */
    @media (max-width: 768px) {
      .navbar { padding: 10px; gap: var(--space-sm); }
      .navbar-center { display: none; }
      .week-grid { grid-template-columns: 80px repeat(7, 1fr); font-size: 12px; }
      .grid-cell { min-height: 36px; padding: var(--space-sm) var(--space-xs); }
      .drawer { width: 100%; position: fixed; right: 0; top: 0; bottom: 0; z-index: 50; }
      .history-item { grid-template-columns: 1fr; gap: var(--space-sm); }
      .history-stat { text-align: left; }
      .summary-header { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-left">
        <button class="btn btn-icon" id="prevWeekBtn" title="Previous Week">◀</button>
        <button class="btn btn-icon" id="nextWeekBtn" title="Next Week">▶</button>
        <button class="btn" id="newWeekBtn">+ New Week</button>
      </div>
      <div class="navbar-center" id="weekLabel">Week</div>
      <div class="navbar-right">
        <button class="btn" id="targetsBtn">Targets</button>
        <button class="btn" id="historyBtn">History</button>
        <button class="btn" id="overallBtn">Overall</button>
        <button class="btn btn-sm" id="settingsBtn">⚙</button>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Week View -->
      <div class="view-container" id="weekView">
        <div class="week-grid" id="weekGrid"></div>
        <div class="week-summary" id="weekSummary"></div>
      </div>

      <!-- History View -->
      <div class="view-container" id="historyView" style="display:none;">
        <div class="view-header">
          <h1 class="view-title">History</h1>
          <p class="view-subtitle">All tracked weeks</p>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>

      <!-- Overall View -->
      <div class="view-container" id="overallView" style="display:none;">
        <div class="view-header">
          <h1 class="view-title">Overall Statistics</h1>
          <p class="view-subtitle">All-time aggregated data</p>
        </div>
        <div class="toggle-row">
          <input type="checkbox" id="useWeekTargets" checked>
          <label for="useWeekTargets">Use week targets (vs default targets)</label>
        </div>
        <div class="overall-grid" id="overallGrid"></div>
      </div>

      <!-- Day Drawer -->
      <div class="drawer" id="dayDrawer">
        <div class="drawer-header">
          <span class="drawer-title" id="drawerTitle">Monday</span>
          <button class="drawer-close" id="drawerClose">×</button>
        </div>

        <div class="drawer-section">
          <div class="drawer-section-title">Voice</div>
          <div class="checkbox-group">
            <label class="checkbox-item">
              <input type="checkbox" id="voiceMini">
              <span>Mini Activation</span>
            </label>
            <label class="checkbox-item">
              <input type="checkbox" id="voiceArticulation">
              <span>Articulation</span>
            </label>
            <label class="checkbox-item">
              <input type="checkbox" id="voiceVocal">
              <span>Vocal Session</span>
            </label>
          </div>
        </div>

        <div class="drawer-section">
          <div class="drawer-section-title">Sport</div>
          <div class="radio-group">
            <label class="radio-item">
              <input type="radio" name="sport" value="none">
              <span>None</span>
            </label>
            <label class="radio-item">
              <input type="radio" name="sport" value="cardio">
              <span>Cardio</span>
            </label>
            <label class="radio-item">
              <input type="radio" name="sport" value="weights_cardio">
              <span>Weights + Cardio</span>
            </label>
          </div>
        </div>

        <div class="drawer-section">
          <div class="drawer-section-title">Work Deep Blocks</div>
          <div class="rating-buttons" id="workRating"></div>
        </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Settings (Default Targets)</h2>

      </div>

        <input type="number" class="form-input" id="defaultArticulation" min="0" max="7">
      </div>
      <div class="form-group">
        <label class="form-label">Voice - Vocal Session (days/week)</label>
        <input type="number" class="form-input" id="defaultVocal" min="0" max="7">
      </div>
      <div class="form-group">
        <label class="form-label">Sport (days/week)</label>
        <input type="number" class="form-input" id="defaultSport" min="0" max="7">
      </div>

  <script>
    // ============ STORAGE KEYS ============
    const STORAGE_KEY = 'weeklyTracker';
    const SETTINGS_KEY = 'weeklyTrackerSettings';

    // ============ DEFAULT SETTINGS ============
    const DEFAULT_SETTINGS = {
      targets: {
        mini: 7,
        articulation: 7,
        vocal: 3,
        sport: 5,
        work: 10
      },
      blocksMaxPerDay: 5
    };

    // ============ STATE ============
    let state = {
      weeks: {},
      currentWeekId: null
    };
    let settings = { ...DEFAULT_SETTINGS };
    let selectedDay = null;
    let currentView = 'week';

    // ============ HELPERS ============
    const DAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const DAY_FULL_NAMES = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June',
                         'July', 'August', 'September', 'October', 'November', 'December'];

    /**
     * Normalize a date to local noon to avoid timezone/DST issues.
     * This ensures consistent weekday calculations.
     */
    function normalizeToLocalNoon(date) {
      const d = new Date(date);
      d.setHours(12, 0, 0, 0);
      return d;
    }

    /**
     * Parse a YYYY-MM-DD string and return a Date normalized to local noon.
     * This avoids issues where parsing as ISO can shift to previous day in certain timezones.
     */
    function parseDateString(dateStr) {
      const [year, month, day] = dateStr.split('-').map(Number);
      const d = new Date(year, month - 1, day, 12, 0, 0, 0);
      return d;
    }

    /**
     * Get the ISO weekday (1=Monday, 7=Sunday) for a date.
     * Uses local noon normalization for consistency.
     */
    function getISOWeekday(date) {
      const d = normalizeToLocalNoon(date);
      const day = d.getDay(); // 0=Sunday, 1=Monday, ...
      return day === 0 ? 7 : day; // Convert to ISO: 1=Monday, 7=Sunday
    }

    /**
     * Get ISO week ID (e.g., "2025-W51") for a given date.
     * Uses local date operations to avoid timezone issues.
     */
    function getISOWeekId(date) {
      const d = normalizeToLocalNoon(date);
      // Find Thursday of this week (ISO weeks are defined by their Thursday)
      const dayOfWeek = getISOWeekday(d);
      const thursday = new Date(d);
      thursday.setDate(d.getDate() + (4 - dayOfWeek));

      // Get the year of the Thursday (this is the ISO week year)
      const year = thursday.getFullYear();

      // Find January 4th of that year (always in week 1)
      const jan4 = new Date(year, 0, 4, 12, 0, 0, 0);
      const jan4Weekday = getISOWeekday(jan4);
      const week1Thursday = new Date(jan4);
      week1Thursday.setDate(jan4.getDate() + (4 - jan4Weekday));

      // Calculate week number
      const weekNum = 1 + Math.round((thursday - week1Thursday) / (7 * 24 * 60 * 60 * 1000));

      return `${year}-W${String(weekNum).padStart(2, '0')}`;
    }

    /**
     * Get the Monday of a given ISO week.
     */
    function getWeekMonday(weekId) {
      const [yearStr, weekPart] = weekId.split('-W');
      const year = parseInt(yearStr);
      const weekNum = parseInt(weekPart);

      // Find January 4th (always in week 1)
      const jan4 = new Date(year, 0, 4, 12, 0, 0, 0);
      const jan4Weekday = getISOWeekday(jan4);

      // Find Monday of week 1
      const week1Monday = new Date(jan4);
      week1Monday.setDate(jan4.getDate() - (jan4Weekday - 1));

      // Add weeks to get to target week's Monday
      const targetMonday = new Date(week1Monday);
      targetMonday.setDate(week1Monday.getDate() + (weekNum - 1) * 7);

      return targetMonday;
    }

    /**
     * Format a date as YYYY-MM-DD using local date parts.
     */
    function formatDate(date) {
      const d = normalizeToLocalNoon(date);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    /**
     * Add days to a date, returning normalized result.
     */
    function addDays(date, days) {
      const d = normalizeToLocalNoon(date);
      d.setDate(d.getDate() + days);
      return d;
    }

    /**
     * Get day index (0-6, Mon-Sun) from a date string.
     */
    function getDayIndex(dateStr) {
      const d = parseDateString(dateStr);
      const weekday = getISOWeekday(d);
      return weekday - 1; // Convert to 0-6 (Mon=0, Sun=6)
    }

    /**
     * Format date range in human-readable format.
     * Examples: "14 December–20 December" or "28 December–3 January"
     */
    function formatDateRange(startDateStr, endDateStr) {
      const start = parseDateString(startDateStr);
      const end = parseDateString(endDateStr);

      const startDay = start.getDate();
      const endDay = end.getDate();
      const startMonth = MONTH_NAMES[start.getMonth()];
      const endMonth = MONTH_NAMES[end.getMonth()];

      if (startMonth === endMonth) {
        return `${startDay}–${endDay} ${startMonth}`;
      } else {
        return `${startDay} ${startMonth}–${endDay} ${endMonth}`;
      }
    }

    function createEmptyDay() {
      return {
        voice: { miniActivation: false, articulation: false, vocalSession: false },
        sport: 'none',
        work: { deepBlocks: 0 },
        guitar: { rating: 0 }
      };
    }

    function createWeek(weekId) {
      const monday = getWeekMonday(weekId);
      const sunday = addDays(monday, 6);
      return {
        weekId,
        startDate: formatDate(monday),
        endDate: formatDate(sunday),
        targets: { ...settings.targets },
        days: Array(7).fill(null).map(() => createEmptyDay())
      };
    }

    // ============ PERSISTENCE ============
    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        state = JSON.parse(saved);
      }
    }

    function saveSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    }

    function loadSettings() {
      const saved = localStorage.getItem(SETTINGS_KEY);
      if (saved) {
        settings = { ...DEFAULT_SETTINGS, ...JSON.parse(saved) };
      }
    }

    // ============ CALCULATIONS ============
    function calcVoiceStats(week) {
      let mini = 0, articulation = 0, vocal = 0;
      week.days.forEach(day => {
        if (day.voice.miniActivation) mini++;
        if (day.voice.articulation) articulation++;
        if (day.voice.vocalSession) vocal++;
      });
      const targets = week.targets;
      const miniPct = targets.mini > 0 ? Math.min(mini / targets.mini, 1) * 100 : 100;
      const artPct = targets.articulation > 0 ? Math.min(articulation / targets.articulation, 1) * 100 : 100;
      const vocalPct = targets.vocal > 0 ? Math.min(vocal / targets.vocal, 1) * 100 : 100;
      const categoryPct = (miniPct + artPct + vocalPct) / 3;
      return { mini, articulation, vocal, miniPct, artPct, vocalPct, categoryPct };
    }

    function calcSportStats(week) {
      let sportDays = 0, cardioDays = 0, weightsCardioDays = 0;
      week.days.forEach(day => {
        if (day.sport === 'cardio') { sportDays++; cardioDays++; }
        else if (day.sport === 'weights_cardio') { sportDays++; weightsCardioDays++; }
      });
      const target = week.targets.sport;
      const sportPct = target > 0 ? Math.min(sportDays / target, 1) * 100 : 100;
      return { sportDays, cardioDays, weightsCardioDays, sportPct };
    }

    function calcWorkStats(week) {
      let totalBlocks = 0;
      week.days.forEach(day => { totalBlocks += day.work.deepBlocks; });
      const target = week.targets.work;
      const workPct = target > 0 ? Math.min(totalBlocks / target, 1) * 100 : 100;
      return { totalBlocks, workPct };
    }

    function calcGuitarStats(week) {
      let sum = 0, practicedDays = 0;
      week.days.forEach(day => {
        if (day.guitar.rating > 0) { sum += day.guitar.rating; practicedDays++; }
      });
      const avg = practicedDays > 0 ? sum / practicedDays : 0;
      return { avg, practicedDays };
    }

    function calcOverallPct(week) {
      const voice = calcVoiceStats(week);
      const sport = calcSportStats(week);
      const work = calcWorkStats(week);
      return (voice.categoryPct + sport.sportPct + work.workPct) / 3;
    }

    function calcAllTimeStats(useWeekTargets = true) {
      const weeks = Object.values(state.weeks);
      if (weeks.length === 0) return null;

      let totalMini = 0, totalArticulation = 0, totalVocal = 0;
      let totalSportDays = 0, totalCardioDays = 0, totalWeightsCardioDays = 0;
      let totalDeepBlocks = 0;
      let totalGuitarSum = 0, totalGuitarPracticedDays = 0;
      let targetMini = 0, targetArticulation = 0, targetVocal = 0, targetSport = 0, targetWork = 0;

      weeks.forEach(week => {
        const targets = useWeekTargets ? week.targets : settings.targets;
        targetMini += targets.mini;
        targetArticulation += targets.articulation;
        targetVocal += targets.vocal;
        targetSport += targets.sport;
        targetWork += targets.work;

        week.days.forEach(day => {
          if (day.voice.miniActivation) totalMini++;
          if (day.voice.articulation) totalArticulation++;
          if (day.voice.vocalSession) totalVocal++;
          if (day.sport === 'cardio') { totalSportDays++; totalCardioDays++; }
          else if (day.sport === 'weights_cardio') { totalSportDays++; totalWeightsCardioDays++; }
          totalDeepBlocks += day.work.deepBlocks;
          if (day.guitar.rating > 0) { totalGuitarSum += day.guitar.rating; totalGuitarPracticedDays++; }
        });
      });

      const miniPct = targetMini > 0 ? Math.min(totalMini / targetMini, 1) * 100 : 100;
      const artPct = targetArticulation > 0 ? Math.min(totalArticulation / targetArticulation, 1) * 100 : 100;
      const vocalPct = targetVocal > 0 ? Math.min(totalVocal / targetVocal, 1) * 100 : 100;
      const voiceCategoryPct = (miniPct + artPct + vocalPct) / 3;
      const sportPct = targetSport > 0 ? Math.min(totalSportDays / targetSport, 1) * 100 : 100;
      const workPct = targetWork > 0 ? Math.min(totalDeepBlocks / targetWork, 1) * 100 : 100;
      const overallPct = (voiceCategoryPct + sportPct + workPct) / 3;
      const guitarAvg = totalGuitarPracticedDays > 0 ? totalGuitarSum / totalGuitarPracticedDays : 0;

      return {
        overallPct, voiceCategoryPct, miniPct, artPct, vocalPct,
        sportPct, totalSportDays, totalCardioDays, totalWeightsCardioDays,
        workPct, totalDeepBlocks,
        guitarAvg, totalGuitarPracticedDays,
        totalMini, totalArticulation, totalVocal,
        weeksCount: weeks.length
      };
    }

    // ============ UI HELPERS ============
    function getPctClass(pct) {
      if (pct >= 80) return 'success';
      if (pct >= 50) return 'warning';
      return 'danger';
    }

    function formatPct(pct) {
      return pct.toFixed(0) + '%';
    }

    function getDonutColor(pct) {
      if (pct >= 80) return 'var(--success)';
      if (pct >= 50) return 'var(--warning)';
      return 'var(--danger)';
    }

    // ============ RENDER FUNCTIONS ============
    function renderWeekGrid() {
      const week = state.weeks[state.currentWeekId];
      if (!week) return;

      const today = formatDate(new Date());
      const monday = getWeekMonday(week.weekId);

      let html = '<div class="grid-header"></div>';
      DAY_NAMES.forEach((name, i) => {
        const date = formatDate(addDays(monday, i));
        const isToday = date === today;
        const isSelected = selectedDay === i;
        let headerClasses = 'grid-header';
        if (isToday) headerClasses += ' today';
        if (isSelected) headerClasses += ' selected';
        html += `<div class="${headerClasses}" data-day="${i}">${name}<span class="header-date">${date.slice(8)}</span></div>`;
      });

      // Voice row
      html += '<div class="grid-label">Voice</div>';
      week.days.forEach((day, i) => {
        const date = formatDate(addDays(monday, i));
        const count = (day.voice.miniActivation ? 1 : 0) + (day.voice.articulation ? 1 : 0) + (day.voice.vocalSession ? 1 : 0);
        const cls = count === 3 ? 'cell-done' : count > 0 ? 'cell-partial' : 'cell-none';
        const colSelected = selectedDay === i ? ' column-selected' : '';
        html += `<div class="grid-cell${colSelected}" data-day="${i}"><span class="cell-content ${cls}">${count}/3</span></div>`;
      });

      // Sport row
      html += '<div class="grid-label">Sport</div>';
      week.days.forEach((day, i) => {
        const label = day.sport === 'none' ? '−' : day.sport === 'cardio' ? 'C' : 'W+C';
        const cls = day.sport !== 'none' ? 'cell-done' : 'cell-none';
        const colSelected = selectedDay === i ? ' column-selected' : '';
        html += `<div class="grid-cell${colSelected}" data-day="${i}"><span class="cell-content ${cls}">${label}</span></div>`;
      });

      // Work row
      html += '<div class="grid-label">Work</div>';
      week.days.forEach((day, i) => {
        const blocks = day.work.deepBlocks;
        const cls = blocks > 0 ? 'cell-done' : 'cell-none';
        const colSelected = selectedDay === i ? ' column-selected' : '';
        html += `<div class="grid-cell${colSelected}" data-day="${i}"><span class="cell-content ${cls}">${blocks}</span></div>`;
      });

      // Guitar row
      html += '<div class="grid-label">Guitar</div>';
      week.days.forEach((day, i) => {
        const rating = day.guitar.rating;
        const cls = rating > 0 ? 'cell-done' : 'cell-none';
        const colSelected = selectedDay === i ? ' column-selected' : '';
        html += `<div class="grid-cell${colSelected}" data-day="${i}"><span class="cell-content ${cls}">${rating > 0 ? rating : '−'}</span></div>`;
      });

      document.getElementById('weekGrid').innerHTML = html;
      document.getElementById('weekLabel').textContent = formatDateRange(week.startDate, week.endDate);

      // Add click handlers to headers and cells
      document.querySelectorAll('.grid-header[data-day]').forEach(header => {
        header.addEventListener('click', () => {
          const dayIndex = parseInt(header.dataset.day);
          openDayDrawer(dayIndex);
        });
      });

      document.querySelectorAll('.grid-cell').forEach(cell => {
        cell.addEventListener('click', () => {
          const dayIndex = parseInt(cell.dataset.day);
          openDayDrawer(dayIndex);
        });
      });
    }

    function renderWeekSummary() {
      const week = state.weeks[state.currentWeekId];
      if (!week) {
        document.getElementById('weekSummary').innerHTML = '<p style="color:var(--text-muted)">No week selected</p>';
        return;
      }

      const voice = calcVoiceStats(week);
      const sport = calcSportStats(week);
      const work = calcWorkStats(week);
      const guitar = calcGuitarStats(week);
      const overall = calcOverallPct(week);

      // SVG Donut chart calculations
      const radius = 42;
      const circumference = 2 * Math.PI * radius;
      const strokeDashoffset = circumference - (overall / 100) * circumference;

      const html = `
        <div class="summary-header">
          <div class="donut-container">
            <svg class="donut-svg" viewBox="0 0 100 100">
              <circle class="donut-track" cx="50" cy="50" r="${radius}"/>
              <circle class="donut-progress" cx="50" cy="50" r="${radius}"
                stroke="${getDonutColor(overall)}"
                stroke-dasharray="${circumference}"
                stroke-dashoffset="${strokeDashoffset}"/>
            </svg>
            <div class="donut-center">
              <span class="donut-percent" style="color: ${getDonutColor(overall)}">${formatPct(overall)}</span>
              <span class="donut-label">Overall</span>
            </div>
          </div>
          <div class="summary-header-info">
            <div class="summary-title">Week Summary</div>
            <div class="summary-subtitle">Voice, Sport & Work completion</div>
          </div>
        </div>

        <div class="summary-stats">
          <div class="stat-category">
            <div class="stat-category-header">
              <span class="stat-category-title">Voice</span>
              <span class="stat-category-pct" style="color: ${getDonutColor(voice.categoryPct)}">${formatPct(voice.categoryPct)}</span>
            </div>
            <div class="stat-progress-bar">
              <div class="stat-progress-fill ${getPctClass(voice.categoryPct)}" style="width: ${Math.min(voice.categoryPct, 100)}%"></div>
            </div>
            <div class="stat-subitems">
              <div class="stat-subitem">
                <div class="stat-subitem-label">Mini</div>
                <div class="stat-subitem-value" style="color: ${getDonutColor(voice.miniPct)}">${voice.mini}/${week.targets.mini}</div>
              </div>
              <div class="stat-subitem">
                <div class="stat-subitem-label">Articulation</div>
                <div class="stat-subitem-value" style="color: ${getDonutColor(voice.artPct)}">${voice.articulation}/${week.targets.articulation}</div>
              </div>
              <div class="stat-subitem">
                <div class="stat-subitem-label">Vocal</div>
                <div class="stat-subitem-value" style="color: ${getDonutColor(voice.vocalPct)}">${voice.vocal}/${week.targets.vocal}</div>
              </div>
            </div>
          </div>

          <div class="stat-category">
            <div class="stat-category-header">
              <span class="stat-category-title">Sport</span>
              <span class="stat-category-pct" style="color: ${getDonutColor(sport.sportPct)}">${formatPct(sport.sportPct)}</span>
            </div>
            <div class="stat-progress-bar">
              <div class="stat-progress-fill ${getPctClass(sport.sportPct)}" style="width: ${Math.min(sport.sportPct, 100)}%"></div>
            </div>
            <div class="stat-detail">
              <span>${sport.sportDays}/${week.targets.sport} days</span>
              <span>${sport.cardioDays}C + ${sport.weightsCardioDays}W+C</span>
            </div>
          </div>

          <div class="stat-category">
            <div class="stat-category-header">
              <span class="stat-category-title">Work</span>
              <span class="stat-category-pct" style="color: ${getDonutColor(work.workPct)}">${formatPct(work.workPct)}</span>
            </div>
            <div class="stat-progress-bar">
              <div class="stat-progress-fill ${getPctClass(work.workPct)}" style="width: ${Math.min(work.workPct, 100)}%"></div>
            </div>
            <div class="stat-detail">
              <span>${work.totalBlocks}/${week.targets.work} deep blocks</span>
            </div>
          </div>

          <div class="stat-category">
            <div class="stat-category-header">
              <span class="stat-category-title">Guitar</span>
              <span class="stat-category-pct" style="color: var(--text-secondary)">Not in overall</span>
            </div>
            <div class="stat-guitar">
              <div class="stat-guitar-item">
                <div class="stat-guitar-value">${guitar.avg > 0 ? guitar.avg.toFixed(1) : '−'}</div>
                <div class="stat-guitar-label">Avg Rating</div>
              </div>
              <div class="stat-guitar-item">
                <div class="stat-guitar-value">${guitar.practicedDays}</div>
                <div class="stat-guitar-label">Practice Days</div>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('weekSummary').innerHTML = html;
    }

    function renderHistory() {
      const weekIds = Object.keys(state.weeks).sort().reverse();

      if (weekIds.length === 0) {
        document.getElementById('historyList').innerHTML = '<p style="color:var(--text-muted)">No weeks tracked yet</p>';
        return;
      }

      let html = `
        <div class="history-item" style="cursor:default;background:var(--bg-tertiary)">
          <div style="font-weight:600">Week</div>
          <div class="history-stat"><div class="history-stat-label">Voice</div></div>
          <div class="history-stat"><div class="history-stat-label">Sport</div></div>
          <div class="history-stat"><div class="history-stat-label">Work</div></div>
          <div class="history-stat"><div class="history-stat-label">Overall</div></div>
          <div class="history-stat"><div class="history-stat-label">Guitar</div></div>
        </div>
      `;

      weekIds.forEach(weekId => {
        const week = state.weeks[weekId];
        const voice = calcVoiceStats(week);
        const sport = calcSportStats(week);
        const work = calcWorkStats(week);
        const guitar = calcGuitarStats(week);
        const overall = calcOverallPct(week);

        html += `
          <div class="history-item" data-week="${weekId}">
            <div class="history-date">${formatDateRange(week.startDate, week.endDate)}</div>
            <div class="history-stat"><span class="${getPctClass(voice.categoryPct)}">${formatPct(voice.categoryPct)}</span></div>
            <div class="history-stat"><span class="${getPctClass(sport.sportPct)}">${formatPct(sport.sportPct)}</span></div>
            <div class="history-stat"><span class="${getPctClass(work.workPct)}">${formatPct(work.workPct)}</span></div>
            <div class="history-stat"><span class="${getPctClass(overall)}">${formatPct(overall)}</span></div>
            <div class="history-stat"><span>${guitar.avg > 0 ? guitar.avg.toFixed(1) : '−'}</span></div>
          </div>
        `;
      });

      document.getElementById('historyList').innerHTML = html;

      document.querySelectorAll('.history-item[data-week]').forEach(item => {
        item.addEventListener('click', () => {
          state.currentWeekId = item.dataset.week;
          showView('week');
        });
      });
    }

    function renderOverall() {
      const useWeekTargets = document.getElementById('useWeekTargets').checked;
      const stats = calcAllTimeStats(useWeekTargets);

      if (!stats) {
        document.getElementById('overallGrid').innerHTML = '<p style="color:var(--text-muted)">No data yet</p>';
        return;
      }

      const html = `
        <div class="overall-card">
          <div class="overall-card-title">Overall</div>
          <div class="overall-percent ${getPctClass(stats.overallPct)}">${formatPct(stats.overallPct)}</div>
          <div class="summary-row">
            <span class="summary-label">Weeks tracked</span>
            <span class="summary-value">${stats.weeksCount}</span>
          </div>
        </div>

        <div class="overall-card">
          <div class="overall-card-title">Voice (${formatPct(stats.voiceCategoryPct)})</div>
          <div class="summary-row">
            <span class="summary-label">Mini Activation</span>
            <span class="summary-value ${getPctClass(stats.miniPct)}">${stats.totalMini} (${formatPct(stats.miniPct)})</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Articulation</span>
            <span class="summary-value ${getPctClass(stats.artPct)}">${stats.totalArticulation} (${formatPct(stats.artPct)})</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Vocal Session</span>
            <span class="summary-value ${getPctClass(stats.vocalPct)}">${stats.totalVocal} (${formatPct(stats.vocalPct)})</span>
          </div>
        </div>

        <div class="overall-card">
          <div class="overall-card-title">Sport (${formatPct(stats.sportPct)})</div>
          <div class="summary-row">
            <span class="summary-label">Total sport days</span>
            <span class="summary-value">${stats.totalSportDays}</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Cardio days</span>
            <span class="summary-value">${stats.totalCardioDays}</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Weights + Cardio days</span>
            <span class="summary-value">${stats.totalWeightsCardioDays}</span>
          </div>
        </div>

        <div class="overall-card">
          <div class="overall-card-title">Work (${formatPct(stats.workPct)})</div>
          <div class="summary-row">
            <span class="summary-label">Total deep blocks</span>
            <span class="summary-value">${stats.totalDeepBlocks}</span>
          </div>
        </div>

        <div class="overall-card">
          <div class="overall-card-title">Guitar</div>
          <div class="summary-row">
            <span class="summary-label">All-time avg rating</span>
            <span class="summary-value">${stats.guitarAvg > 0 ? stats.guitarAvg.toFixed(2) : '−'}</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Total practice days</span>
            <span class="summary-value">${stats.totalGuitarPracticedDays}</span>
          </div>
        </div>
      `;

      document.getElementById('overallGrid').innerHTML = html;
    }

    function renderGuitarButtons() {
      let html = '';
      for (let i = 0; i <= 5; i++) {
        html += `<button class="rating-btn" data-rating="${i}">${i}</button>`;
      }
      document.getElementById('guitarRating').innerHTML = html;

      document.querySelectorAll('#guitarRating .rating-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const rating = parseInt(btn.dataset.rating);
          updateDayData('guitar', rating);
        });
      });
    }

    function renderWorkButtons() {
      let html = '';
      for (let i = 0; i <= 5; i++) {
        html += `<button class="rating-btn" data-blocks="${i}">${i}</button>`;
      }
      document.getElementById('workRating').innerHTML = html;

      document.querySelectorAll('#workRating .rating-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const blocks = parseInt(btn.dataset.blocks);
          updateDayData('work', blocks);
        });
      });
    }

    // ============ VIEW MANAGEMENT ============
    function showView(view) {
      currentView = view;
      document.getElementById('weekView').style.display = view === 'week' ? 'block' : 'none';
      document.getElementById('historyView').style.display = view === 'history' ? 'block' : 'none';
      document.getElementById('overallView').style.display = view === 'overall' ? 'block' : 'none';
      closeDayDrawer();

      if (view === 'week') {
        renderWeekGrid();
        renderWeekSummary();
      } else if (view === 'history') {
        renderHistory();
      } else if (view === 'overall') {
        renderOverall();
      }
    }

    // ============ DAY DRAWER ============
    function openDayDrawer(dayIndex) {
      const week = state.weeks[state.currentWeekId];
      if (!week) return;

      selectedDay = dayIndex;
      const day = week.days[dayIndex];
      const monday = getWeekMonday(week.weekId);
      const date = formatDate(addDays(monday, dayIndex));

      document.getElementById('drawerTitle').textContent = `${DAY_FULL_NAMES[dayIndex]}, ${date}`;
      document.getElementById('voiceMini').checked = day.voice.miniActivation;
      document.getElementById('voiceArticulation').checked = day.voice.articulation;
      document.getElementById('voiceVocal').checked = day.voice.vocalSession;

      document.querySelectorAll('input[name="sport"]').forEach(radio => {
        radio.checked = radio.value === day.sport;
      });

      // Update work buttons
      document.querySelectorAll('#workRating .rating-btn').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.blocks) === day.work.deepBlocks);
      });

      // Update guitar buttons
      document.querySelectorAll('#guitarRating .rating-btn').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.rating) === day.guitar.rating);
      });

      document.getElementById('dayDrawer').classList.add('open');
      renderWeekGrid(); // Re-render to show selected column highlight
    }

    function closeDayDrawer() {
      selectedDay = null;
      document.getElementById('dayDrawer').classList.remove('open');
      renderWeekGrid(); // Re-render to remove selected column highlight
    }

    function updateDayData(field, value) {
      if (selectedDay === null) return;
      const week = state.weeks[state.currentWeekId];
      if (!week) return;

      const day = week.days[selectedDay];

      switch (field) {
        case 'voiceMini':
          day.voice.miniActivation = value;
          break;
        case 'voiceArticulation':
          day.voice.articulation = value;
          break;
        case 'voiceVocal':
          day.voice.vocalSession = value;
          break;
        case 'sport':
          day.sport = value;
          break;
        case 'work':
          day.work.deepBlocks = Math.max(0, Math.min(5, value));
          document.querySelectorAll('#workRating .rating-btn').forEach(btn => {
            btn.classList.toggle('active', parseInt(btn.dataset.blocks) === day.work.deepBlocks);
          });
          break;
        case 'guitar':
          day.guitar.rating = Math.max(0, Math.min(5, value));
          document.querySelectorAll('#guitarRating .rating-btn').forEach(btn => {
            btn.classList.toggle('active', parseInt(btn.dataset.rating) === day.guitar.rating);
          });
          break;
      }

      saveState();
      renderWeekGrid();
      renderWeekSummary();
    }

    // ============ WEEK NAVIGATION ============
    function navigateWeek(direction) {
      const weekIds = Object.keys(state.weeks).sort();
      if (weekIds.length === 0) return;

      const currentIndex = weekIds.indexOf(state.currentWeekId);
      const newIndex = currentIndex + direction;

      if (newIndex >= 0 && newIndex < weekIds.length) {
        state.currentWeekId = weekIds[newIndex];
        showView('week');
      }
    }

    function createNewWeek() {
      const currentWeekId = getISOWeekId(new Date());

      if (!state.weeks[currentWeekId]) {
        state.weeks[currentWeekId] = createWeek(currentWeekId);
        state.currentWeekId = currentWeekId;
      } else {
        // Find next week
        const weekIds = Object.keys(state.weeks).sort();
        const lastWeekId = weekIds[weekIds.length - 1];
        const lastMonday = getWeekMonday(lastWeekId);
        const nextMonday = addDays(lastMonday, 7);
        const nextWeekId = getISOWeekId(nextMonday);

        if (!state.weeks[nextWeekId]) {
          state.weeks[nextWeekId] = createWeek(nextWeekId);
        }
        state.currentWeekId = nextWeekId;
      }

      saveState();
      showView('week');
    }

    // ============ MODALS ============
    function openTargetsModal() {
      const week = state.weeks[state.currentWeekId];
      if (!week) return;

      document.getElementById('targetMini').value = week.targets.mini;
      document.getElementById('targetArticulation').value = week.targets.articulation;
      document.getElementById('targetVocal').value = week.targets.vocal;
      document.getElementById('targetSport').value = week.targets.sport;
      document.getElementById('targetWork').value = week.targets.work;
      document.getElementById('targetsModal').classList.add('open');
    }

    function closeTargetsModal() {
      document.getElementById('targetsModal').classList.remove('open');
    }

    function saveTargets() {
      const week = state.weeks[state.currentWeekId];
      if (!week) return;

      week.targets.mini = Math.max(0, parseInt(document.getElementById('targetMini').value) || 0);
      week.targets.articulation = Math.max(0, parseInt(document.getElementById('targetArticulation').value) || 0);
      week.targets.vocal = Math.max(0, parseInt(document.getElementById('targetVocal').value) || 0);
      week.targets.sport = Math.max(0, parseInt(document.getElementById('targetSport').value) || 0);
      week.targets.work = Math.max(0, parseInt(document.getElementById('targetWork').value) || 0);

      saveState();
      closeTargetsModal();
      renderWeekSummary();
    }

    function useDefaultTargets() {
      const week = state.weeks[state.currentWeekId];
      if (!week) return;

      week.targets = { ...settings.targets };
      saveState();
      closeTargetsModal();
      renderWeekSummary();
    }

    function openSettingsModal() {
      document.getElementById('defaultMini').value = settings.targets.mini;
      document.getElementById('defaultArticulation').value = settings.targets.articulation;
      document.getElementById('defaultVocal').value = settings.targets.vocal;
      document.getElementById('defaultSport').value = settings.targets.sport;
      document.getElementById('defaultWork').value = settings.targets.work;
      document.getElementById('defaultBlocksMax').value = settings.blocksMaxPerDay;
      document.getElementById('settingsModal').classList.add('open');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.remove('open');
    }

    function saveSettingsData() {
      settings.targets.mini = Math.max(0, parseInt(document.getElementById('defaultMini').value) || 0);
      settings.targets.articulation = Math.max(0, parseInt(document.getElementById('defaultArticulation').value) || 0);
      settings.targets.vocal = Math.max(0, parseInt(document.getElementById('defaultVocal').value) || 0);
      settings.targets.sport = Math.max(0, parseInt(document.getElementById('defaultSport').value) || 0);
      settings.targets.work = Math.max(0, parseInt(document.getElementById('defaultWork').value) || 0);
      settings.blocksMaxPerDay = Math.max(1, parseInt(document.getElementById('defaultBlocksMax').value) || 5);

      saveSettings();
      closeSettingsModal();
    }

    // ============ EXPORT/IMPORT ============
    function exportData() {
      const data = {
        state,
        settings,
        exportedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `weekly-tracker-${formatDate(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData() {
      document.getElementById('importFile').click();
    }

    function handleImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.state && data.state.weeks) {
            state = data.state;
            if (data.settings) {
              settings = { ...DEFAULT_SETTINGS, ...data.settings };
              saveSettings();
            }
            saveState();

            // Set current week
            const weekIds = Object.keys(state.weeks).sort();
            if (weekIds.length > 0) {
              const currentWeekId = getISOWeekId(new Date());
              state.currentWeekId = weekIds.includes(currentWeekId) ? currentWeekId : weekIds[weekIds.length - 1];
            }

            showView('week');
            alert('Data imported successfully!');
          } else {
            alert('Invalid data format');
          }
        } catch (err) {
          alert('Failed to parse JSON file');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // ============ INITIALIZATION ============
    function init() {
      loadSettings();
      loadState();

      // Ensure current week exists
      const currentWeekId = getISOWeekId(new Date());
      if (!state.weeks[currentWeekId]) {
        state.weeks[currentWeekId] = createWeek(currentWeekId);
      }
      state.currentWeekId = currentWeekId;
      saveState();

      renderGuitarButtons();
      renderWorkButtons();

      // Event listeners - Navigation
      document.getElementById('prevWeekBtn').addEventListener('click', () => navigateWeek(-1));
      document.getElementById('nextWeekBtn').addEventListener('click', () => navigateWeek(1));
      document.getElementById('newWeekBtn').addEventListener('click', createNewWeek);
      document.getElementById('targetsBtn').addEventListener('click', openTargetsModal);
      document.getElementById('historyBtn').addEventListener('click', () => showView('history'));
      document.getElementById('overallBtn').addEventListener('click', () => showView('overall'));
      document.getElementById('settingsBtn').addEventListener('click', openSettingsModal);

      // Event listeners - Drawer
      document.getElementById('drawerClose').addEventListener('click', closeDayDrawer);
      document.getElementById('voiceMini').addEventListener('change', (e) => updateDayData('voiceMini', e.target.checked));
      document.getElementById('voiceArticulation').addEventListener('change', (e) => updateDayData('voiceArticulation', e.target.checked));
      document.getElementById('voiceVocal').addEventListener('change', (e) => updateDayData('voiceVocal', e.target.checked));
      document.querySelectorAll('input[name="sport"]').forEach(radio => {
        radio.addEventListener('change', (e) => updateDayData('sport', e.target.value));
      });

      // Event listeners - Targets Modal
      document.getElementById('targetsClose').addEventListener('click', closeTargetsModal);
      document.getElementById('targetsSave').addEventListener('click', saveTargets);
      document.getElementById('targetsUseDefaults').addEventListener('click', useDefaultTargets);

      // Event listeners - Settings Modal
      document.getElementById('settingsClose').addEventListener('click', closeSettingsModal);
      document.getElementById('settingsSave').addEventListener('click', saveSettingsData);

      // Event listeners - Export/Import
      document.getElementById('exportBtn').addEventListener('click', exportData);
      document.getElementById('importBtn').addEventListener('click', importData);
      document.getElementById('importFile').addEventListener('change', handleImport);

      // Event listener - Overall toggle
      document.getElementById('useWeekTargets').addEventListener('change', renderOverall);

      // Close modals on overlay click
      document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) {
            overlay.classList.remove('open');
          }
        });
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeDayDrawer();
          closeTargetsModal();
          closeSettingsModal();
        }
      });

      showView('week');
    }

    init();
  </script>
</body>
</html>
